<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Face Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #173f67;
        }

        .navbar {
            background: #173f67;
            color: white;
            padding: 22px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
            font-size: 25px;
        }

        .navbar span {
            font-size: 14px;
        }

        .container {
            max-width: 650px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 30px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 35px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .btn {
            background: #2176bd;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #195f9a;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #2176bd;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>Face Attendance System</h1>
        <span>Smart • Secure • Automated</span>
    </div>

    <div class="container">

        <div class="card">

            <h2>👤 Student Face Verification</h2>

            <p class="subtitle">
                Enter your Student ID to continue with face verification.
            </p>

            <!-- Student ID Form -->
            <form action="{% url 'face_verification' %}" method="get">

                <label for="student_id">
                    Student ID
                </label>

                <input
                    type="text"
                    id="student_id"
                    name="student_id"
                    placeholder="Enter your Student ID"
                    required
                >

                <button type="submit" class="btn">
                    Start Face Verification
                </button>

            </form>

            <a href="/" class="back">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
